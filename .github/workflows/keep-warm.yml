name: Keep backend warm

# Render free web services sleep after ~15 min idle, so the first real visitor
# after a quiet stretch hits a slow cold start (or a 502). This pings the
# health endpoint on a schedule to keep it awake.
#
# Notes:
#   - GitHub can delay scheduled runs by several minutes under load, so we ping
#     every 10 min to stay comfortably under Render's ~15 min sleep window.
#   - GitHub disables scheduled workflows after 60 days with no repo commits.
#   - The ping itself wakes a sleeping service and waits for it, so a few
#     retries absorb the cold-start latency before we call it a failure.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# A newer run supersedes an in-flight one; no point stacking pings.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (with cold-start tolerance)
        run: |
          URL="https://agency-arena-api.onrender.com/health"
          for attempt in 1 2 3 4; do
            code=$(curl -sS -o /dev/null -m 60 -w "%{http_code}" "$URL" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Backend did not return 200 after retries — it may be deploying or down."
          exit 1
